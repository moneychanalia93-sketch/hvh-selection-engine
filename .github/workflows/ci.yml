name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -v
      - name: End-to-end demo
        run: python -m hvh demo
      - name: Small benchmark (proves the bench command runs; CI numbers are not published)
        run: python -m hvh bench --apps 2000 --http-requests 200 --out ${{ runner.temp }}/bench
